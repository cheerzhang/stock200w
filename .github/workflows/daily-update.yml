name: Daily stock data update

on:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Europe/Amsterdam"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-update.yml"
      - "scripts/local_update.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stock-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      DAILY_LIMIT: "25"
      TIINGO_DAILY_LIMIT: "50"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update stock data
        run: ./scripts/local_update.sh

      - name: Commit and push changed data
        run: |
          if git diff --quiet -- data/stocks.json data/update-state.json; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json data/update-state.json
          git commit -m "Update stock data"
          git push
