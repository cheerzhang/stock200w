name: Stock prices and weekly Wishlist EPS

on:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Europe/Amsterdam"
    - cron: "0 12 * * 6"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stock-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      DAILY_LIMIT: "25"
      TIINGO_DAILY_LIMIT: "50"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update stock data
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "0 12 * * 6" ]; then
            python3 scripts/update_data.py --earnings-only
          else
            # Reserve Saturday Alpha Vantage quota for the noon EPS run.
            # Price data still updates through Tiingo that day.
            if [ "$(TZ=Europe/Amsterdam date +%u)" = "6" ]; then
              export DAILY_LIMIT=0
            fi
            ./scripts/local_update.sh --rescan-wishlist
          fi

      - name: Commit and push changed data
        run: |
          if git diff --quiet -- data/stocks.json data/update-state.json data/earnings.json; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json data/update-state.json data/earnings.json
          git commit -m "Update stock data"
          git push
